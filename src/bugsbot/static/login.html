<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bugsbot · sign in</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --border: #dfe3ea; --accent: #3b5bdb; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1e26; --text: #e4e7ee; --muted: #8b93a7; --border: #2b313d; --accent: #748ffc; --bad: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 28px; width: 100%; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 18px; }
  .gh { display: flex; align-items: center; justify-content: center; gap: 8px; background: #24292f; color: #fff;
        text-decoration: none; border-radius: 6px; padding: 9px; margin-bottom: 14px; }
  [hidden] { display: none !important; }
  #err { color: var(--bad); min-height: 1.4em; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <h1>🐛 bugsbot</h1>
  <p>Sign in to manage the agent harness.</p>
  <a class="gh" id="gh" href="/auth/github" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    Sign in with GitHub</a>
  <div id="err"></div>
</div>
<script>
fetch("/api/auth/options").then(r => r.json()).then(o => {
  document.getElementById("gh").hidden = !o.github;
  if (!o.github) document.getElementById("err").innerHTML =
    "GitHub sign-in isn't configured yet. On the server, run <code>bugsbot login-link</code> and open the link it prints, then set it up under Settings.";
});
</script>
</body>
</html>
