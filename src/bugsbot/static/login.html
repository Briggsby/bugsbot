<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bugsbot · sign in</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --border: #dfe3ea; --accent: #3b5bdb; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1e26; --text: #e4e7ee; --muted: #8b93a7; --border: #2b313d; --accent: #748ffc; --bad: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 28px; width: 100%; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 18px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
          border-radius: 6px; padding: 9px 10px; margin-bottom: 12px; }
  button { width: 100%; font: inherit; padding: 9px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  #err { color: var(--bad); min-height: 1.4em; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<form id="f">
  <h1>🐛 bugsbot</h1>
  <p>Sign in to manage the agent harness.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Bugsbot": "1" },
                                          body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (res.ok) location.href = "/";
  else document.getElementById("err").textContent = (await res.json().catch(() => ({}))).detail || "Sign-in failed";
};
</script>
</body>
</html>
